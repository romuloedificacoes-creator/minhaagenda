<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Tarefas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], } } }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; padding: 0; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const RocketIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-indigo-600 dark:text-indigo-400"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path></svg>);
        const PlusIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>);
        const TrashIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>);
        const EditIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>);
        const CheckIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>);
        const XIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>);
        const CheckCircleIcon = ({ completed }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill={completed ? "#4F46E5" : "none"} stroke={completed ? "#4F46E5" : "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>{completed && <polyline points="22 4 12 14.01 9 11.01" stroke="white"></polyline>}</svg>);
        const ChevronLeftIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>);
        const ChevronRightIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>);
        const SunIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>);
        const MoonIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>);

        function AgendaApp() {
          const [tasks, setTasks] = useState([]);
          const [user, setUser] = useState(null);
          const [baseDate, setBaseDate] = useState(new Date());
          const [newTasksInputs, setNewTasksInputs] = useState({});
          const [editingTaskId, setEditingTaskId] = useState(null);
          const [editingText, setEditingText] = useState('');

          const [darkMode, setDarkMode] = useState(() => {
            try { return JSON.parse(localStorage.getItem('agenda-dark-mode')) || false; } catch { return false; }
          });

          // EFEITO DE SALVAMENTO LOCAL (FALLBACK)
          useEffect(() => {
            if (user?.mode === 'local') {
              localStorage.setItem('minha-agenda-mensal', JSON.stringify(tasks));
            }
          }, [tasks, user]);

          useEffect(() => {
            let unsubscribe = null;

            const setupFirebase = async () => {
              try {
                  
   
                // ==========================================
                // ⚠️ COLOQUE SUAS CHAVES DO FIREBASE AQUI ⚠️
                // Quando criar sua conta no Firebase, cole as chaves dentro das chaves {} abaixo:
                // ==========================================
                const firebaseConfig = {
                     apiKey: "AIzaSyD0Gni88ScyPeBf1efP8uPVNkL1l7_nI-0",
  authDomain: "minhaagenda-1dd5b.firebaseapp.com",
  projectId: "minhaagenda-1dd5b",
  storageBucket: "minhaagenda-1dd5b.firebasestorage.app",
  messagingSenderId: "17477333639",
  appId: "1:17477333639:web:4306416d88a45d6294fe22"
                    
  
};
                  // apiKey: "SUA_API_KEY",
                  // authDomain: "SEU_PROJETO.firebaseapp.com",
                  // projectId: "SEU_PROJETO",
                };

                // SE NÃO TIVER CHAVES (como está agora), ativa o MODO LOCAL
                if (Object.keys(firebaseConfig).length === 0) {
                  setUser({ mode: 'local' });
                  const localTasks = JSON.parse(localStorage.getItem('minha-agenda-mensal') || '[]');
                  setTasks(localTasks);
                  return;
                }

                const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                const { getAuth, signInAnonymously } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                const { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);
                window.fb = { db, doc, setDoc, deleteDoc, collection, appId: 'minha-agenda-app' };

                const cred = await signInAnonymously(auth);
                setUser({ uid: cred.user.uid, mode: 'cloud' });

                const tasksRef = collection(db, 'artifacts', 'minha-agenda-app', 'users', cred.user.uid, 'tasks');
                unsubscribe = onSnapshot(tasksRef, (snapshot) => {
                  const cloudTasks = [];
                  snapshot.forEach((docSnap) => cloudTasks.push({ id: docSnap.id, ...docSnap.data() }));
                  setTasks(cloudTasks);
                });
              } catch (err) {
                console.error("Erro Firebase:", err);
                setUser({ mode: 'local' });
                const localTasks = JSON.parse(localStorage.getItem('minha-agenda-mensal') || '[]');
                setTasks(localTasks);
              }
            };
            setupFirebase();
            return () => { if (unsubscribe) unsubscribe(); };
          }, []);

          useEffect(() => { localStorage.setItem('agenda-dark-mode', JSON.stringify(darkMode)); }, [darkMode]);

          const getStartOfWeek = (date) => {
            const d = new Date(date); d.setHours(0, 0, 0, 0);
            return new Date(d.setDate(d.getDate() - d.getDay()));
          };

          const formatDateStr = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
          
          const startOfWeek = getStartOfWeek(baseDate);
          const weekDays = Array.from({ length: 7 }).map((_, i) => {
            const d = new Date(startOfWeek); d.setDate(startOfWeek.getDate() + i); return d;
          });

          const changeWeek = (offset) => { const newDate = new Date(baseDate); newDate.setDate(baseDate.getDate() + offset * 7); setBaseDate(newDate); };
          const goToToday = () => setBaseDate(new Date());

          const monthName = startOfWeek.toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
          const capitalizedMonth = monthName.charAt(0).toUpperCase() + monthName.slice(1);
          const DIAS_SEMANA_CURTO = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
          const todayStr = formatDateStr(new Date());

          const handleInputChange = (dateStr, value) => setNewTasksInputs(prev => ({ ...prev, [dateStr]: value }));

          const addTask = async (e, dateStr) => {
            e.preventDefault();
            const text = newTasksInputs[dateStr];
            if (!text || !text.trim() || !user) return;

            const newId = Date.now().toString();
            const newTask = { text: text.trim(), date: dateStr, completed: false };

            setTasks(prev => [...prev, { id: newId, ...newTask }]);
            setNewTasksInputs(prev => ({ ...prev, [dateStr]: '' }));

            if (user.mode === 'cloud' && window.fb) {
              const { db, doc, setDoc, appId } = window.fb;
              await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'tasks', newId), newTask);
            }
          };

          const toggleTask = async (id) => {
            if (!user) return;
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            setTasks(prev => prev.map(t => t.id === id ? { ...t, completed: !t.completed } : t));

            if (user.mode === 'cloud' && window.fb) {
              const { db, doc, setDoc, appId } = window.fb;
              await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'tasks', id), { completed: !task.completed }, { merge: true });
            }
          };

          const deleteTask = async (id) => {
            if (!user) return;
            setTasks(prev => prev.filter(t => t.id !== id));
            
            if (user.mode === 'cloud' && window.fb) {
              const { db, doc, deleteDoc, appId } = window.fb;
              await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'tasks', id));
            }
          };

          const startEdit = (task) => { setEditingTaskId(task.id); setEditingText(task.text); };
          const cancelEdit = () => { setEditingTaskId(null); setEditingText(''); };

          const saveEdit = async (id) => {
            if (!user) return;
            const newText = editingText.trim();
            if (!newText) { cancelEdit(); return; }

            setTasks(prev => prev.map(t => t.id === id ? { ...t, text: newText } : t));
            setEditingTaskId(null);

            if (user.mode === 'cloud' && window.fb) {
              const { db, doc, setDoc, appId } = window.fb;
              await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'tasks', id), { text: newText }, { merge: true });
            }
          };

          const tarefasDaSemana = tasks.filter(t => weekDays.some(d => formatDateStr(d) === t.date));
          const weekProgress = tarefasDaSemana.length === 0 ? 0 : Math.round((tarefasDaSemana.filter(t => t.completed).length / tarefasDaSemana.length) * 100);

          return (
            <div className={darkMode ? 'dark' : ''}>
              <div className="min-h-screen bg-gray-100 dark:bg-gray-900 flex flex-col items-center p-4 sm:p-6 font-sans text-gray-800 dark:text-gray-100 transition-colors duration-300">
                <div className="w-full max-w-[1400px] mt-4">
                  
                  {/* Cabeçalho */}
                  <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-4 sm:p-6 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 border border-gray-200 dark:border-gray-700 transition-colors">
                    <div>
                      <div className="flex items-center gap-3">
                        <RocketIcon />
                        <h1 className="text-2xl sm:text-3xl font-bold text-indigo-700 dark:text-indigo-400 transition-colors">Agenda de Tarefas</h1>
                      </div>
                      <div className="flex items-center gap-3 mt-2">
                        <p className="text-gray-500 dark:text-gray-400 text-sm font-medium transition-colors">Progresso da Semana:</p>
                        <div className="w-32 h-2.5 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                          <div className="h-full bg-indigo-500 transition-all duration-500" style={{ width: `${weekProgress}%` }}></div>
                        </div>
                        <span className="text-sm text-indigo-600 dark:text-indigo-400 font-bold">{weekProgress}%</span>
                      </div>
                    </div>
                    
                    <div className="flex items-center bg-gray-50 dark:bg-gray-700 rounded-xl border border-gray-200 dark:border-gray-600 p-1 transition-colors">
                      <button onClick={() => changeWeek(-1)} className="p-2 text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-white dark:hover:bg-gray-600 rounded-lg transition-all" title="Semana Anterior"><ChevronLeftIcon /></button>
                      <div className="w-48 text-center font-medium text-gray-700 dark:text-gray-200 capitalize transition-colors">{capitalizedMonth}</div>
                      <button onClick={() => changeWeek(1)} className="p-2 text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-white dark:hover:bg-gray-600 rounded-lg transition-all" title="Próxima Semana"><ChevronRightIcon /></button>
                    </div>

                    <div className="flex items-center gap-2">
                      <div className="hidden sm:flex items-center gap-1.5 mr-2 px-3 py-1.5 rounded-full bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 transition-colors">
                        {user?.mode === 'local' ? (
                          <><div className="w-2 h-2 rounded-full bg-yellow-500"></div> <span className="text-xs text-gray-600 dark:text-gray-300 font-medium">Salvo Localmente</span></>
                        ) : user?.mode === 'cloud' ? (
                          <><div className="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_5px_#22c55e]"></div> <span className="text-xs text-gray-600 dark:text-gray-300 font-medium">Nuvem Ativa</span></>
                        ) : (
                          <><div className="w-2 h-2 rounded-full bg-gray-400 animate-pulse"></div> <span className="text-xs text-gray-600 dark:text-gray-300 font-medium">Conectando...</span></>
                        )}
                      </div>
                      
                      <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors">
                        {darkMode ? <SunIcon /> : <MoonIcon />}
                      </button>
                      <button onClick={goToToday} className="px-4 py-2 bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 font-medium rounded-lg transition-colors border border-indigo-100 dark:border-indigo-800">
                        Ir para Hoje
                      </button>
                    </div>
                  </div>

                  {/* Painel Kanban (Dias) */}
                  <div className="flex gap-4 overflow-x-auto pb-6 snap-x w-full custom-scrollbar items-stretch">
                    {weekDays.map((day, index) => {
                      const dateStr = formatDateStr(day);
                      const isToday = dateStr === todayStr;
                      const dayTasks = tasks.filter(t => t.date === dateStr);
                      const inputValue = newTasksInputs[dateStr] || '';

                      return (
                        <div key={dateStr} className={`min-w-[280px] sm:min-w-[300px] flex-1 snap-center flex-shrink-0 rounded-2xl border shadow-sm flex flex-col h-[65vh] transition-colors ${isToday ? 'border-indigo-400 dark:border-indigo-500 ring-2 ring-indigo-50 dark:ring-indigo-900 bg-white dark:bg-gray-800' : 'border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800'}`}>
                          
                          <div className={`p-4 border-b dark:border-gray-700 rounded-t-2xl transition-colors ${isToday ? 'bg-indigo-50 dark:bg-indigo-900/40' : 'bg-gray-50 dark:bg-gray-700/50'}`}>
                            <div className="flex justify-between items-baseline">
                              <h3 className={`font-semibold transition-colors ${isToday ? 'text-indigo-700 dark:text-indigo-400' : 'text-gray-700 dark:text-gray-300'}`}>{DIAS_SEMANA_CURTO[index]}</h3>
                              <span className={`text-lg font-bold transition-colors ${isToday ? 'text-indigo-700 dark:text-indigo-400' : 'text-gray-900 dark:text-gray-100'}`}>{day.getDate()}</span>
                            </div>
                            <span className="text-xs text-gray-500 dark:text-gray-400 mt-1 transition-colors">{dayTasks.length} {dayTasks.length === 1 ? 'tarefa' : 'tarefas'}</span>
                          </div>

                          <div className="p-3 border-b border-gray-100 dark:border-gray-700 transition-colors">
                            <form onSubmit={(e) => addTask(e, dateStr)} className="flex gap-2">
                              <input type="text" value={inputValue} onChange={(e) => handleInputChange(dateStr, e.target.value)} placeholder="Nova tarefa..." className="flex-1 px-3 py-2 text-sm bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-gray-800 text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 transition-all"/>
                              <button type="submit" disabled={!inputValue.trim()} className="bg-indigo-600 dark:bg-indigo-500 hover:bg-indigo-700 dark:hover:bg-indigo-600 disabled:bg-gray-300 dark:disabled:bg-gray-600 text-white p-2 rounded-lg flex items-center justify-center transition-colors"><PlusIcon /></button>
                            </form>
                          </div>

                          <div className="p-3 overflow-y-auto flex-1 space-y-2 custom-scrollbar">
                            {dayTasks.length === 0 ? (
                              <div className="text-center py-6 text-gray-400 dark:text-gray-500 text-sm transition-colors">Livre</div>
                            ) : (
                              dayTasks.map((task) => (
                                <div key={task.id} className={`group flex items-start gap-2 p-2 rounded-lg border transition-all ${task.completed ? 'bg-gray-50 dark:bg-gray-700/50 border-gray-100 dark:border-gray-700 opacity-60' : 'bg-white dark:bg-gray-800 border-gray-100 dark:border-gray-600 shadow-sm hover:border-indigo-200 dark:hover:border-indigo-500'}`}>
                                  {editingTaskId === task.id ? (
                                    <div className="flex-1 flex flex-col gap-2 w-full">
                                      <input type="text" value={editingText} onChange={(e) => setEditingText(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') saveEdit(task.id); if (e.key === 'Escape') cancelEdit(); }} autoFocus className="w-full px-2 py-1 text-sm bg-white dark:bg-gray-900 border border-indigo-300 dark:border-indigo-500 rounded focus:outline-none focus:ring-1 focus:ring-indigo-500 text-gray-800 dark:text-gray-100 transition-colors"/>
                                      <div className="flex justify-end gap-1">
                                        <button onClick={cancelEdit} className="p-1 text-gray-500 hover:text-red-500 transition-colors bg-gray-100 dark:bg-gray-700 rounded" title="Cancelar"><XIcon /></button>
                                        <button onClick={() => saveEdit(task.id)} className="p-1 text-white bg-indigo-500 hover:bg-indigo-600 transition-colors rounded" title="Salvar"><CheckIcon /></button>
                                      </div>
                                    </div>
                                  ) : (
                                    <>
                                      <button onClick={() => toggleTask(task.id)} className="flex-shrink-0 text-gray-400 dark:text-gray-500 hover:text-indigo-600 dark:hover:text-indigo-400 mt-0.5 transition-colors focus:outline-none"><CheckCircleIcon completed={task.completed} /></button>
                                      <div className="flex-1 min-w-0" onDoubleClick={() => startEdit(task)}>
                                        <p className={`text-sm leading-snug break-words transition-colors cursor-text ${task.completed ? 'line-through text-gray-400 dark:text-gray-500' : 'text-gray-700 dark:text-gray-200'}`}>{task.text}</p>
                                      </div>
                                      <div className="flex flex-shrink-0 opacity-0 group-hover:opacity-100 lg:focus:opacity-100 focus:opacity-100 transition-opacity gap-1">
                                        <button onClick={() => startEdit(task)} className="text-gray-300 dark:text-gray-500 hover:text-blue-500 dark:hover:text-blue-400 p-1 rounded transition-colors" title="Editar"><EditIcon /></button>
                                        <button onClick={() => deleteTask(task.id)} className="text-gray-300 dark:text-gray-500 hover:text-red-500 dark:hover:text-red-400 p-1 rounded transition-colors" title="Excluir"><TrashIcon /></button>
                                      </div>
                                    </>
                                  )}
                                </div>
                              ))
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AgendaApp />);
    </script>
</body>
</html>
